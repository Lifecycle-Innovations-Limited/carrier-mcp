name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate server.json and smithery.yaml
        run: |
          python3 - <<'PYEOF'
          import json

          with open("server.json", encoding="utf-8") as fh:
              data = json.load(fh)
          for field in ("name", "description", "version"):
              if not data.get(field):
                  raise SystemExit(f"server.json: missing required field '{field}'")
          print("server.json: valid JSON with required fields present")
          PYEOF
          pip install --quiet pyyaml
          python3 - <<'PYEOF'
          import yaml

          with open("smithery.yaml", encoding="utf-8") as fh:
              data = yaml.safe_load(fh)
          for field in ("name", "description", "startCommand"):
              if not data.get(field):
                  raise SystemExit(f"smithery.yaml: missing required field '{field}'")
          start = data["startCommand"]
          fn = start.get("commandFunction", "")
          if "CARRIER_API_KEY" not in fn or "config.apiKey" not in fn:
              raise SystemExit("smithery.yaml: commandFunction must pass config.apiKey as CARRIER_API_KEY")
          if "-p" not in fn or "carrier-mcp" not in fn:
              raise SystemExit("smithery.yaml: commandFunction must run the -p carrier-mcp form")
          print("smithery.yaml: valid YAML with required fields present")
          PYEOF
