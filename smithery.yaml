name: carrier/mcp
description: "Carrier MCP: programmable eSIM and mobile connectivity for your agent. 161 tools (80 read, 61 write, 20 admin), 5 prompts."
homepage: https://carrier.llc
categories:
  - telecom
  - business
  - api

startCommand:
  type: stdio
  # Smithery passes the user's config to this function. Without it the apiKey
  # never reaches the server, which then exits 1 for lack of a credential.
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "-p", "@carrierllc/mcp", "carrier-mcp"],
      env: { CARRIER_API_KEY: config.apiKey },
    })
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: Carrier API Key
        description: "Your Carrier API key. Get one at https://carrier.llc."
        sensitive: true
    required:
      - apiKey
